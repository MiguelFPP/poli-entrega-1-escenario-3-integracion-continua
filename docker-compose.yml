name: pos

services:
  db:
    image: postgres:17-alpine
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    # Solo se monta el script de inicialización (crea pos_test).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pos-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: pos-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:-postgresql://pos:pos@db:5432/pos}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - pos-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: pos-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: '3000'
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - pos-net

volumes:
  pgdata:
    name: pos-pgdata

networks:
  pos-net:
    name: pos-net
    driver: bridge
